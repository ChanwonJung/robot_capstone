# config/robot_defaults.yaml
#
# Master parameter defaults for the robot capstone system.
# All launch files load this first; package YAMLs and inline dicts override
# only what they need.  Loading order: defaults → pkg_yaml → inline_dict.
#
# Locate at runtime via $ROBOT_CAPSTONE_ROOT/config/robot_defaults.yaml
# ($ROBOT_CAPSTONE_ROOT is set by launch_env.bash).
#
# ─────────────────────────────────────────────────────────────────────────────
# DECOUPLING NOTE — grasp candidate pool vs BT retry budget
#   • max_grasp_candidates — grasp pool size seeded to the BT blackboard.
#     GraspGen's equivalent (`topk_num_grasps`) lives in graspgen_params.yaml
#     and follows the paper-aligned default of 100.
#   • bt_pick_retries      — BT RetryUntilSuccessful num_attempts. The BT will
#     try at most this many published candidates in order. Decoupled from the
#     pool size so we can publish a paper-aligned goal set (100) while keeping
#     the BT retry budget small to avoid SIGABRT-prone goal flooding into the
#     hybrid planner.
# ─────────────────────────────────────────────────────────────────────────────

/**:
  ros__parameters:

    # ── TF / planning frames ─────────────────────────────────────────────────
    robot_frame:        "panda_link0"   # grasping, projection — origin of robot coords
    planning_frame:     "panda_link0"   # MoveIt — same as robot_frame
    world_frame:        "world"         # RViz / MoveIt workspace root
    planning_group:     "panda_arm"     # MoveIt planning group (7-DOF arm)
    end_effector_link:  "panda_link8"   # TCP used for Cartesian goals

    # ── Panda home ("ready") pose ─────────────────────────────────────────────
    # Used by MoveToHome BT node; must match Isaac Sim start configuration.
    home_joint_names:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    home_joint_values:  [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]

    # Observation pose — where the scene loads, which is the configuration
    # camera_extrinsics.yaml was captured at and therefore the only pose a scan
    # is valid from. NOT the Panda "ready" state above: the BT returns here at
    # the end of every cycle, and a scan from anywhere else is silently
    # projected to wrong world coordinates rather than failing.
    #
    # Left unset (the default) the BT latches it from the first /joint_states —
    # it comes up before the arm has moved, so that sample is the load pose by
    # construction, and the latched values are logged at startup.
    #
    # Pin it here only if the BT may be restarted while the arm is parked
    # somewhere else; paste the values from that startup log.
    # observation_joint_values: [...]

    # ── Camera topics (Isaac Sim ROS 2 bridge — see sim/isaac_ros_camera_bridge.py)
    # Isaac names the RGB and the depth/camera_info streams differently:
    #   EE  rgb=/ee_camera/image_raw  depth+info=/ee_rgbd_camera/*
    #   TOP rgb=/camera/image_raw     depth+info=/rgbd_camera/*
    # The old /ee_camera/depth_image and /top_camera/* values matched nothing;
    # every launch file happened to override them, which is why nothing broke
    # loudly. Anything reading these straight from here was silently dead.
    ee_rgb_topic:           "/ee_camera/image_raw"
    ee_depth_topic:         "/ee_rgbd_camera/depth_image"
    ee_camera_info_topic:   "/ee_rgbd_camera/camera_info"
    top_rgb_topic:          "/camera/image_raw"
    top_depth_topic:        "/rgbd_camera/depth_image"
    top_camera_info_topic:  "/rgbd_camera/camera_info"

    # ── Camera extrinsics ─────────────────────────────────────────────────────
    # Empty = package-internal default.  Override per-session:
    #   extrinsics_config:=/abs/path/camera_extrinsics_isaac.yaml
    extrinsics_config: ""

    # ── YOLO class taxonomy (3-class Isaac Sim model) ─────────────────────────
    #   0 = arm / person   1 = bottle   2 = box
    class_allowlist:    [0, 1, 2]   # detections passed through the filter
    halt_class_ids:     [0]         # classes that trigger E-stop (level 3)

    # ── Grasp candidate pool size ────────────────────────────────────────────
    # Seeded to the BT blackboard. GraspGen has its own
    # `topk_num_grasps` (default 100, see graspgen_params.yaml).
    max_grasp_candidates: 100

    # ── BT pick-phase retry budget ───────────────────────────────────────────
    # BT RetryUntilSuccessful num_attempts in pick_and_place.xml. Decoupled
    # from the grasp pool size — the published goal set can be large (paper
    # recommends 100), but the BT only attempts the top N to avoid flooding
    # the hybrid planner with replanning goals (SIGABRT risk).
    bt_pick_retries: 5
