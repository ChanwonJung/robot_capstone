# flake8 config for this package. Mirrors ament_flake8's bundled default, plus
# three rules we deliberately do not enforce. Referenced explicitly by
# test_flake8.py — ament_flake8 does NOT auto-discover this file.
#
#   Q000  Double quotes found but single quotes preferred.
#         Nothing else in this repo follows the single-quote convention, and it
#         accounted for ~95% of the findings here. Enforcing it in two packages
#         and nowhere else buys inconsistency, not consistency.
#
#   A001  variable "__package__" is shadowing a python builtin.
#         qwen_cli.py sets __package__ so it can be run directly as a script
#         while still using relative imports. That IS the idiom; renaming it
#         breaks the CLI.
#
#   A003  class attribute "type" is shadowing a python builtin.
#         DestinationSpec.type is a wire-format field name shared with
#         bt_pkg/src/destination_calculator.cpp, which dispatches on the raw
#         string. Renaming it silently breaks the place stage.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000,A001,A003
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
